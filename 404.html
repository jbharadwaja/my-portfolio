<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Julian Bharadwaja</title>
<!-- Self-contained (spec §7): GitHub Pages serves this at any missing URL, however deep, so it is the one file with
     absolute paths, and it carries its own CSS (tokens and type only), no JS and no WebGL. -->
<link rel="icon" href="/my-portfolio/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist+Mono:wght@100..900&text=%E2%86%92%E2%86%97%E2%86%90%E2%89%A4&display=swap">
<style>
:root {
  --c-paper:   #F6F6F3;
  --c-ink:     #0A0A0A;
  --c-ink-60:  rgb(10 10 10 / .6);
  --c-ink-35:  rgb(10 10 10 / .35);
  --c-signal:  #FF4D00;
  --bg: var(--c-paper);  --fg: var(--c-ink);  --fg-muted: var(--c-ink-60);  --fg-faint: var(--c-ink-35);  --accent: var(--c-signal);
  --font-sans: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --fs-display: clamp(2.75rem, 0.9857rem + 7.2381vw, 7.5rem);
  --fs-body:    clamp(1rem, 0.9768rem + 0.0952vw, 1.0625rem);
  --fs-label:   clamp(0.8125rem, 0.7893rem + 0.0952vw, 0.875rem);
  --gutter: clamp(16px, 3.3333vw, 48px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 var(--fs-body)/1.55 var(--font-sans);
  font-stretch: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
main {
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: clamp(16px, 1.5vw, 20px);
  padding: var(--gutter);
}
.eyebrow { font: 500 0.6875rem/1.3 var(--font-mono); font-stretch: 100%; letter-spacing: .04em; color: var(--fg-muted); }
h1 { font-size: var(--fs-display); font-weight: 800; font-stretch: 112%; letter-spacing: -0.02em; line-height: .92; text-wrap: balance; }
a {
  font: 500 var(--fs-label)/1.3 var(--font-mono); font-stretch: 100%; letter-spacing: .04em;
  color: inherit;
  text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: var(--fg-faint); text-underline-offset: .3em;
  transition: text-decoration-color 150ms;
}
@media (hover: hover) { a:hover { text-decoration-color: var(--accent); text-decoration-thickness: 2px; } }
a:focus-visible { outline: 2px solid var(--c-ink); outline-offset: 3px; }
::selection { background: var(--accent); color: var(--c-ink); }
</style>
</head>
<body>
<main>
  <p class="eyebrow">404 · not in the latent space</p>
  <h1>Lost in latent space.</h1>
  <a href="/my-portfolio/">← back to the portfolio</a>
</main>
</body>
</html>
